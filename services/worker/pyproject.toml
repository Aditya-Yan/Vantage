[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-intel"
version = "0.1.0"
description = "Recruiting intelligence platform worker: ingestion, research, maintenance"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
worker = "recruiting_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# Puts the worker root on sys.path so `from tests.conftest import ...` resolves
# under the bare `pytest` binary, not just `python -m pytest` (which adds cwd
# implicitly). Without this the two invocations disagree.
pythonpath = ["."]
markers = [
    "integration: requires a running local Postgres (see docs/TESTING.md)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert freely and shadow names in fixtures.
"tests/*" = ["S101"]
